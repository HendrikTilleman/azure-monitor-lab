name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
      - 'workloads/webapp/package*.json'
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
      - 'workloads/webapp/package*.json'

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: workloads/webapp/package-lock.json
      - name: Install the pinned Bicep CLI
        run: |
          az bicep install --version v0.37.4
          echo "$HOME/.azure/bin" >> "$GITHUB_PATH"
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Repository PSGallery -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
      - name: Install web app dependencies
        working-directory: workloads/webapp
        run: npm ci
