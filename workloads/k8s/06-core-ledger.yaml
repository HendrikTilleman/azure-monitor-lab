# Render __LEDGER_DNS_LABEL__ and __WEBAPP_OUTBOUND_CIDR__ before applying.
# Additional outbound IPs must be added as separate /32 source ranges.
apiVersion: v1
kind: ConfigMap
metadata:
  name: core-ledger-code
  namespace: demo
data:
  ledger.py: |
    import collections
    import hashlib
    import hmac
    import json
    import math
    import os
    import random
    import signal
    import threading
    import time
    import uuid
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import parse_qs, urlsplit


    def log(event, **fields):
        print(json.dumps({"time": datetime.now(timezone.utc).isoformat(),
                          "event": event, **fields}), flush=True)


    def percentile(values, fraction=0.95):
        return sorted(values)[max(0, math.ceil(len(values) * fraction) - 1)] if values else None


    class Work:
        def __init__(self, client, operation, payload):
            self.client = client
            self.operation = operation
            self.payload = payload
            self.queued = time.monotonic()
            self.started = None
            self.finished = None
            self.done = threading.Event()
            self.result = None


    class Ledger:
        def __init__(self, workers=4, queue_timeout=8.0):
            self.workers = workers
            self.queue_timeout = queue_timeout
            self.condition = threading.Condition()
            self.queue = collections.deque()
            self.active = {}
            self.history = collections.deque()
            self.waits = collections.deque()
            self.batch_active = 0
            self.stopping = False
            self.threads = [threading.Thread(target=self.worker, daemon=True)
                            for _ in range(workers)]
            for thread in self.threads:
                thread.start()

        def submit(self, client, operation, payload):
            work = Work(client, operation, payload)
            with self.condition:
                if self.stopping:
                    return 503, {"error": "shutting_down"}, 0
                self.queue.append(work)
                self.batch_active += operation == "statements"
                self.condition.notify()
            if not work.done.wait(self.queue_timeout):
                with self.condition:
                    if work.started is None and not work.done.is_set():
                        self.queue.remove(work)
                        self.batch_active -= operation == "statements"
                        now = time.monotonic()
                        waited = (now - work.queued) * 1000
                        self.waits.append((now, waited))
                        self.prune(now)
                        return 503, {"error": "queue_timeout"}, waited
                work.done.wait()
            status, body = work.result
            return status, body, ((work.started or work.finished) - work.queued) * 1000

        def worker(self):
            while True:
                with self.condition:
                    self.condition.wait_for(lambda: self.queue or self.stopping)
                    if self.stopping and not self.queue:
                        return
                    work = self.queue.popleft()
                    now = time.monotonic()
                    if now - work.queued >= self.queue_timeout:
                        work.finished = now
                        work.result = (503, {"error": "queue_timeout"})
                        self.batch_active -= work.operation == "statements"
                        self.waits.append((now, (now - work.queued) * 1000))
                        self.prune(now)
                        work.done.set()
                        continue
                    work.started = now
                    self.active[id(work)] = work
                try:
                    if work.operation == "postings":
                        time.sleep(random.uniform(0.025, 0.040))
                        result = {"postingId": str(uuid.uuid4()),
                                  "outcome": "rejected" if random.random() < 0.01 else "accepted"}
                    else:
                        time.sleep(random.uniform(2.0, 3.0))
                        digest = hashlib.sha256(json.dumps(work.payload, sort_keys=True).encode()).hexdigest()
                        result = {"period": work.payload["period"], "segment": work.payload["segment"],
                                  "aggregate": int(digest[:12], 16), "records": 10000}
                    work.result = (200, result)
                except Exception as error:
                    log("worker_error", errorType=type(error).__name__, message=str(error))
                    work.result = (500, {"error": "processing_failed"})
                finally:
                    with self.condition:
                        work.finished = time.monotonic()
                        del self.active[id(work)]
                        self.batch_active -= work.operation == "statements"
                        self.history.append((work.started, work.finished, work.client))
                        self.waits.append((work.finished, (work.started - work.queued) * 1000))
                        self.prune(work.finished)
                        work.done.set()

        def prune(self, now):
            while self.history and self.history[0][1] < now - 15:
                self.history.popleft()
            while self.waits and self.waits[0][0] < now - 15:
                self.waits.popleft()

        def stats(self):
            with self.condition:
                now = time.monotonic()
                self.prune(now)
                busy = collections.defaultdict(float)
                intervals = list(self.history) + [(w.started, now, w.client) for w in self.active.values()]
                for start, end, client in intervals:
                    busy[client] += max(0, end - max(start, now - 15))
                total = sum(busy.values())
                return {"busyWorkers": len(self.active), "poolSize": self.workers,
                        "queueDepth": len(self.queue), "batchActive": self.batch_active,
                        "p95QueueMs": percentile([wait for _, wait in self.waits]),
                        "busyShareByClient": {client: round(seconds / total, 4)
                                              for client, seconds in busy.items()} if total else {}}

        def stop(self):
            with self.condition:
                self.stopping = True
                self.condition.notify_all()
            for thread in self.threads:
                thread.join(timeout=self.queue_timeout + 4)


    class Server(ThreadingHTTPServer):
        daemon_threads = True
        request_queue_size = 128

        def __init__(self, address, ledger, key):
            self.ledger = ledger
            self.key = key
            super().__init__(address, Handler)


    class Handler(BaseHTTPRequestHandler):
        def log_message(self, *_):
            pass

        def send_error(self, code, message=None, explain=None):
            self.reply(code, {"error": message or self.responses[code][0]},
                       operation="http_error", started=time.monotonic())

        def reply(self, status, body, queue_ms=0, client=None, operation=None, started=None):
            data = json.dumps(body).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.send_header("X-Ledger-Queue-Ms", f"{queue_ms:.3f}")
            with self.server.ledger.condition:
                self.send_header("X-Ledger-Batch-Active", str(self.server.ledger.batch_active))
            try:
                self.end_headers()
                if self.command != "HEAD":
                    self.wfile.write(data)
            except (BrokenPipeError, ConnectionResetError):
                log("client_disconnected", client=client, operation=operation, status=status)
            if operation:
                elapsed = (time.monotonic() - started) * 1000
                log("request", client=client, operation=operation, queueMs=round(queue_ms, 3),
                    serviceMs=round(max(0, elapsed - queue_ms), 3), status=status)

        def handle_request(self):
            self.connection.settimeout(10)
            started = time.monotonic()
            parsed = urlsplit(self.path)
            if self.command == "GET" and parsed.path in ("/healthz", "/readyz"):
                return self.reply(200, {"status": "ready"}, operation=parsed.path[1:], started=started)
            client = self.headers.get("X-Client-Id", "")
            supplied = self.headers.get("X-Ledger-Key", "")
            if not client or len(client) > 128 or not hmac.compare_digest(supplied.encode(), self.server.key.encode()):
                return self.reply(401, {"error": "unauthorized"},
                                  client=client[:128], operation="unauthorized", started=started)
            operation = None
            if self.command == "POST" and parsed.path == "/v1/postings":
                operation = "postings"
                try:
                    length = int(self.headers.get("Content-Length", "0"))
                    if not 0 < length <= 8192:
                        raise ValueError("Body must contain between 1 and 8192 bytes.")
                    payload = json.loads(self.rfile.read(length))
                    if not isinstance(payload, dict):
                        raise ValueError("Expected a JSON object.")
                    amount = payload.get("amount")
                    if isinstance(amount, bool) or not isinstance(amount, (int, float)) or not math.isfinite(amount) or amount <= 0:
                        raise ValueError("Amount must be positive and finite.")
                    for field in ("currency", "channel", "reference"):
                        if not isinstance(payload.get(field), str) or not 0 < len(payload[field]) <= 128:
                            raise ValueError(f"{field} must be a nonempty string, at most 128 characters.")
                except (ValueError, json.JSONDecodeError, UnicodeDecodeError, TimeoutError) as error:
                    return self.reply(400, {"error": "invalid_request", "message": str(error)},
                                      client=client, operation=operation, started=started)
            elif self.command == "GET" and parsed.path == "/v1/statements":
                operation = "statements"
                query = parse_qs(parsed.query)
                if any(len(query.get(field, [])) != 1 or len(query[field][0]) > 128
                       for field in ("period", "segment")):
                    return self.reply(400, {"error": "period_and_segment_required"},
                                      client=client, operation=operation, started=started)
                payload = {field: query[field][0] for field in ("period", "segment")}
            else:
                return self.reply(404, {"error": "not_found"},
                                  client=client, operation="not_found", started=started)
            status, body, queue_ms = self.server.ledger.submit(client, operation, payload)
            self.reply(status, body, queue_ms, client, operation, started)

        do_GET = handle_request
        do_POST = handle_request


    def main():
        key = os.environ["LEDGER_KEY"]
        if not key:
            raise ValueError("LEDGER_KEY must not be empty.")
        workers = int(os.environ.get("LEDGER_WORKERS", "4"))
        if workers < 1:
            raise ValueError("LEDGER_WORKERS must be positive.")
        ledger = Ledger(workers)
        server = Server(("0.0.0.0", 8080), ledger, key)
        stopped = threading.Event()

        def shutdown(*_):
            stopped.set()
            threading.Thread(target=server.shutdown, daemon=True).start()

        signal.signal(signal.SIGTERM, shutdown)
        signal.signal(signal.SIGINT, shutdown)

        def report_stats():
            while not stopped.wait(15):
                log("stats", **ledger.stats())

        threading.Thread(target=report_stats, daemon=True).start()
        log("start", version="3.2.0", poolSize=workers, queueTimeoutSeconds=8)
        try:
            server.serve_forever()
        finally:
            stopped.set()
            server.server_close()
            ledger.stop()
            log("end")


    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-ledger
  namespace: demo
  labels: { app: core-ledger, version: 3.2.0 }
spec:
  replicas: 2
  selector:
    matchLabels: { app: core-ledger }
  template:
    metadata:
      labels: { app: core-ledger, version: 3.2.0 }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ledger
          image: python:3.11-slim
          command: ["python", "-u", "-B", "/app/ledger.py"]
          env:
            - name: LEDGER_WORKERS
              value: "4"
            - name: LEDGER_KEY
              valueFrom:
                secretKeyRef: { name: mission-ledger, key: key }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
      volumes:
        - name: code
          configMap: { name: core-ledger-code }
---
apiVersion: v1
kind: Service
metadata:
  name: core-ledger
  namespace: demo
spec:
  selector: { app: core-ledger }
  ports:
    - { port: 80, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: core-ledger-public
  namespace: demo
  annotations:
    service.beta.kubernetes.io/azure-dns-label-name: "__LEDGER_DNS_LABEL__"
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - "__WEBAPP_OUTBOUND_CIDR__"
  selector: { app: core-ledger }
  ports:
    - { port: 80, targetPort: http }
